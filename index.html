<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <meta name="description" content="gea-wrc — Plataforma SaaS" />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GEA Social" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GEA Social" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      (function () {
        try {
          var s = localStorage.getItem('vueuse-color-scheme'),
            p = window.matchMedia('(prefers-color-scheme: dark)').matches,
            d = s === 'dark' || (s !== 'light' && p);
          document.documentElement.classList.add(d ? 'dark' : 'light');
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
    />
    <title>GEA-WRC</title>

    <!-- SEO & Meta Tags -->
    <meta
      name="description"
      content="GEA-WRC es tu plataforma SaaS integral para la gestión, trazabilidad y control de los procesos de recolección, aprovechamiento y sostenibilidad."
    />
    <meta
      name="keywords"
      content="GEA-WRC, SaaS, gestión ambiental, trazabilidad, recolección, aprovechamiento, reciclaje, sostenibilidad"
    />
    <meta name="author" content="GEA-WRC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gea-wrc.com/" />
    <meta property="og:title" content="GEA-WRC — Plataforma SaaS Integral" />
    <meta
      property="og:description"
      content="Gestiona, traza y controla tus procesos de recolección y aprovechamiento con la plataforma más avanzada del mercado."
    />
    <!-- TODO: Reemplazar con la URL absoluta de un banner real o logo para redes -->
    <meta property="og:image" content="https://gea-wrc.com/src/assets/favicon/android-chrome-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://gea-wrc.com/" />
    <meta name="twitter:title" content="GEA-WRC — Plataforma SaaS Integral" />
    <meta
      name="twitter:description"
      content="Gestiona, traza y controla tus procesos de recolección y aprovechamiento con la plataforma más avanzada del mercado."
    />
    <meta name="twitter:image" content="https://gea-wrc.com/src/assets/favicon/android-chrome-512x512.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
